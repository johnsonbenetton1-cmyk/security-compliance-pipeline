name: Enterprise Security Scan Pipeline

on:
  push:
    branches: [ main, master, release/** ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  sast-code-scan:
    name: Static Application Security Testing (SAST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python, javascript, go

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  iac-linting:
    name: Infrastructure-as-Code (IaC) Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Checkov Inspection
        uses: bridgecrewio/checkov-action@master
        with:
          framework: dockerfile,terraform,kubernetes
          output_format: cli
          soft_fail: false

  container-scan:
    name: Container Vulnerability Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t enterprise-app:latest .

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'enterprise-app:latest'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  perimeter-validation:
    name: Edge & TLS Hardening Verification
    runs-on: ubuntu-latest
    needs: [sast-code-scan, iac-linting, container-scan]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Test SSL/TLS Configuration with Testssl.sh
        uses: drwetter/testssl.sh@master
        with:
        target: 'https://yourstagingapp.com'
          args: '--sneaky --protocols --criminals'
